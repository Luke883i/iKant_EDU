name: R7 V13 source Git object import (pinned evidence)
on:
  push:
    branches:
      - refactor/r7-v13-semantic-transplant-gated-20261115
    paths:
      - scripts/r7-v13-import-gitpack.py
      - .github/workflows/r7-v13-source-import.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-source:
    if: github.repository == 'Luke883i/iKant_EDU' && github.ref == 'refs/heads/refactor/r7-v13-semantic-transplant-gated-20261115'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      statuses: write
    timeout-minutes: 12
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rehydrate and verify exact original V13 Git object graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/r7-v13-import-gitpack.py --push --receipt "$RUNNER_TEMP/r7-v13-import-receipt.json"
      - name: Preserve import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-v13-source-pack-import-${{ github.sha }}
          path: ${{ runner.temp }}/r7-v13-import-receipt.json
          if-no-files-found: ignore
      - name: Record bounded import blocker in PR 249
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if test -s "$RUNNER_TEMP/r7-v13-import-receipt.json"; then
            {
              echo "### R7/V13 import attempt \`${GITHUB_SHA:0:12}\`"
              echo 'Import BLOCKED. Exact diagnostic (fail-closed):'
              echo '\`\`\`json'
              cat "$RUNNER_TEMP/r7-v13-import-receipt.json"
              echo '\`\`\`'
            } > "$RUNNER_TEMP/r7-v13-diagnostic-comment.md"
            gh issue comment 249 --body-file "$RUNNER_TEMP/r7-v13-diagnostic-comment.md"
          fi

      - name: Publish bounded import error as commit status
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r7-v13-import-receipt.json"
          try:
              d=json.loads(p.read_text());reason=str(d.get("error","UNKNOWN_FAILURE"))
          except Exception:
              reason="RECEIPT_NOT_AVAILABLE"
          url="https://api.github.com/repos/Luke883i/iKant_EDU/statuses/"+os.environ["GITHUB_SHA"]
          payload=json.dumps({"state":"failure","context":"r7-v13-import-diagnostic","description":reason[:138]}).encode()
          req=urllib.request.Request(url,data=payload,method="POST",headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"r7-v13-diagnostic"})
          with urllib.request.urlopen(req,timeout=20) as response: print("DIAG_STATUS",response.status)
          PY
