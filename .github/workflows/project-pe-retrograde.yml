name: PE retrograde original-bound evidence gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pe-evidence:
    name: PE-retrograde-original-bound (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Real Git source, original C72 stager, owner isolation and UX gate tests
        run: node --test tests/project-pe-retrograde.test.mjs
      - name: Ten million deterministic semantic evaluations — independent finite oracle
        run: |
          node scripts/project-pe-retrograde-falsify.mjs 10000000 883 > pe-10m.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('pe-10m.json','utf8')); if(r.cases_executed!==10000000||r.families!==40||r.independent_oracle_disagreements!==0||r.monotonicity_violations!==0||r.distinct_semantic_signatures<1000) process.exit(1);"
      - name: Preserve exact finite-falsification evidence, not provider proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-retrograde-10m-node-${{ matrix.node }}
          path: pe-10m.json
          retention-days: 14
          if-no-files-found: ignore
