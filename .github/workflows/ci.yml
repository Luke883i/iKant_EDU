name: iKant_LE qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin historical PR251 epoch and qualify current PR253 source (strict AND)
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/governance/changes/edu-onezip-runtime-successor.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pr253-epoch-qualification.mjs '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/pr253-dual-epoch.json"
          git worktree add --detach "$RUNNER_TEMP/pr251-epoch" 888a5878a30864e6db7813b3d8b236cde46cce40
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD)" = "888a5878a30864e6db7813b3d8b236cde46cce40"
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD^{tree})" = "6dab517b2ef0462b9c1222dc9ec2a8c164344977"
          echo 'Current exact-source HEAD gate passed; historical PR251 checks are isolated, not current EDU qualification.' >> "$GITHUB_STEP_SUMMARY"
          # Independent historical M1 oracle: run on the original immutable epoch,
          # not on the successor PR253 checkout.
          (cd "$RUNNER_TEMP/pr251-epoch" && node --test tests/cora-m1-shared-evidence.test.mjs)
          (cd "$RUNNER_TEMP/pr251-epoch" && node --test tests/cora-m2-owner-provider-metrics.test.mjs)
          (cd "$RUNNER_TEMP/pr251-epoch" && node --test --test-name-pattern='real Git checkout preserves historical owner pin ledger' tests/cora-pr-d1-blob-dedup.test.mjs)
          (cd "$RUNNER_TEMP/pr251-epoch" && node --test --test-name-pattern='real Git tree contains the eleven original historical blobs' tests/cora-pr-f-qualification.test.mjs)
          # Historical source observers are tested on their immutable Git epoch,
          # while current PR253 tests assert that they cannot inherit that proof.
          (cd "$RUNNER_TEMP/pr251-epoch" && node --test --test-name-pattern='actual checkout|real Git-indexed V5-B/CORA|actual HEAD Git|single original audit readback|D2 exposes one original V5-B audit|actual Git-indexed V5-B census|real original source observer|exact main checkout' tests/cora-pr-a-backlog.test.mjs tests/cora-pr-b-docs.test.mjs tests/cora-pr-c-ci.test.mjs tests/cora-pr-d2-single-audit.test.mjs tests/cora-pr-f-qualification.test.mjs tests/cora-pr-g-evidence-readback.test.mjs tests/cora-reticular-hygiene.test.mjs)
      - name: PR252 multi-level Git physical plus executable-code source witness (no release)
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          node scripts/pr251-forensic-hypergraph.mjs --convergence > "$RUNNER_TEMP/pr252-convergence.json"
          node --input-type=commonjs - "$RUNNER_TEMP/pr252-convergence.json" <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const r=JSON.parse(fs.readFileSync(process.argv[2]));
          assert.equal(r.assessment.schema,'ikant-pr252-multilevel-source-gate/v1');
          assert.equal(r.before.files,1645);
          assert.ok(r.after.files<r.before.files,'NO_FILE_CONTRACTION');
          assert.equal(r.assessment.physical.pass,true,'NO_NET_REPO_BYTE_CONTRACTION');
          assert.equal(r.assessment.implementation.pass,true,'NO_COMPONENT_SOURCE_HALVING');
          assert.equal(r.assessment.global_dod,'HOLD');
          assert.equal(r.assessment.product_go,false);
          assert.equal(r.assessment.architecture.external_consumers,'UNKNOWN');
          console.log(JSON.stringify({head:r.head,before:r.before,after:r.after,assessment:r.assessment},null,2));
          NODE
      - name: PR251 lossless JSON-value quotient versus immutable Git preimages
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const base='0b2ec2f4b4d90a448991523e726ef19f010ab34b';
          const rows=[["contracts/mcp-external-mutation-assurance-v2.json","c31ca377f26917e8dc4b02c1ebd90a1f7f422f5e"],["contracts/repository-health-v10.json","f0615a8e035a7ed5112bff2cf285e047fa4bdf52"],["contracts/project-v5c-edu-minimum-dod.json","7fa2ce18da4b349ce1719d4a2c94e085c0631c07"],["contracts/project-v5e-cognition-dod.json","9d04071f994ce3e48fa4fe072d552d2f77e1d51e"],["contracts/cora-pr-b-documentation-v1.json","aa6bf4bde2c9958bc2b7e93d5a0741440ef2b0e6"],["contracts/oneshell-40-product-ci.json","ec8500f16c29d58946f7b7cb2b572b41462bd5aa"],["contracts/bootstrap-channel-lineage.json","64247ae90cae0fbf9839f288e2700939d678ba12"],["contracts/cora-pr-f-integrated-qualification-v1.json","2e38181460adf0deeb45dfd7b8c6e86dceb25d5b"],["contracts/cora-m2-owner-provider-metrics-v1.json","99254f133b6e0abce1ce1a1a22f043c110fc5a34"],["contracts/cora-three-streams-retrograde-v1.json","4e22c6deab3aab31654f1cd2365fdf9e0b2676ca"],["contracts/cora-reticular-hygiene-v1.json","583ff9e067d3e8daf0bd2c20362f97833a483309"],["contracts/project-pe-retrograde-dod.json","77f722079ab43dba67d14d71d007ac1a9fb105fe"],["contracts/cora-s3-source-convergence-v1.json","970ebd7a1faa9ec194ec4757ed8f5b095590a837"],["contracts/project-edu-h1-v5-dod-trace.json","ef9b2acdb03dd7d87db1b1429a0b3d6dd1febaf5"]];
          const git=(...args)=>cp.execFileSync('git',args,{encoding:'utf8',maxBuffer:2097152}).trim();
          assert.equal(git('rev-parse',base+'^{commit}'),base);
          // This producer is byte-exact (native workflow cmp), not merely JSON-value-exact.
          assert.equal(git('rev-parse','HEAD:contracts/p0p1-100-selection.json'),
            '6a0ee424bfe189b2f2defeeb2c81f12b1d38ba2a','P0P1_BYTE_PIN_DRIFT');
          // C51 rebuilds SHA-derived qualification artifacts and requires byte-exact committed receipts.
          assert.equal(git('rev-parse','HEAD:contracts/supersystem-runtime-conformance-v1_1.json'),
            '29ede03add624be3dbcfd64768f12cfe095047ae','C51_SUPERSYSTEM_SOURCE_BYTE_PIN_DRIFT');
          let saved=0;
          for(const [path,preimage] of rows){
            assert.equal(git('rev-parse',base+':'+path),preimage,'ORIGINAL_PREIMAGE_CHANGED:'+path);
            const before=cp.execFileSync('git',['show',base+':'+path],{maxBuffer:2097152});
            const after=fs.readFileSync(path);
            const original=JSON.parse(before.toString('utf8'));
            const quotient=JSON.parse(after.toString('utf8'));
            assert.deepStrictEqual(quotient,original,'VALUE_DRIFT:'+path);
            assert.ok(after.length<before.length,'NO_PHYSICAL_CONTRACTION:'+path);
            assert.deepStrictEqual(JSON.parse(JSON.stringify(quotient)),original,'ROUNDTRIP_DRIFT:'+path);
            const mutated=structuredClone(quotient),first=Object.keys(mutated)[0];
            assert.ok(first,'MUTANT_REQUIRES_ROOT_FIELD:'+path);
            delete mutated[first];
            assert.notDeepStrictEqual(mutated,original,'FALSE_NEGATIVE_MUTANT:'+path);
            saved+=before.length-after.length;
          }
          assert.ok(saved>=35000,'INSUFFICIENT_MEASURED_BYTE_CONTRACTION');
          console.log(JSON.stringify({schema:'pr251-semantic-json-quotient/v1',
            base,head:git('rev-parse','HEAD'),file_count:rows.length,
            bytes_saved:saved,mutation_rejected:rows.length,
            typed_value_equivalence:true,raw_byte_identity:false,
            runtime_equivalence:'NOT_INFERRED',external_consumers:'UNKNOWN',
            global_dod:'HOLD',product_go:false}));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### PR251 original Git JSON-value quotient\n\n'+
            '14 source catalog objects preserved; P0/P1 and C51 byte-exact sources excluded; '+saved+' tracked bytes saved. '+
            'Independent negative mutants rejected. Original byte identities changed; '+
            'runtime and owner/provider gates remain independent. G0=HOLD.\n');
          NODE
      - name: C139/C143 bounded source contraction readback
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          old=$(git cat-file -s 3f38cb22fe1f4c2b5a038ef4eb942722383ec1e5:host/c139-edu-v2-turn.mjs)
          new=$(git cat-file -s HEAD:host/c139-edu-v2-turn.mjs)
          test "$new" -lt "$old"
          node --check host/c139-edu-v2-turn.mjs
          printf 'C139 shared original source: %s -> %s bytes (%s fewer); policy owner and C87 unchanged. G0=HOLD.\n' "$old" "$new" "$((old-new))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: PR251 typed hypergraph witness (source only, not release)
        id: sg
        if: ${{ !cancelled() && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        shell: bash
        run: |
          set +e
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          if ! node scripts/pr251-forensic-hypergraph.mjs --deep > "$RUNNER_TEMP/pr251-source-hypergraph.json" 2> "$RUNNER_TEMP/pr251-source-hypergraph.stderr"; then
            diagnosis=$(grep -m1 -E 'Error|ERR_|SyntaxError|ReferenceError|TypeError' "$RUNNER_TEMP/pr251-source-hypergraph.stderr" | tr -cd 'A-Za-z0-9_: .-' | cut -c 1-140 || true)
            echo "source_error=${diagnosis:-CENSUS_FAILED_NO_DETAIL}" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/pr251-source-hypergraph.stderr"
            exit 1
          fi 2>"$RUNNER_TEMP/pr251-graph-stderr.log"
          code=$?
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"pr251-graph-stderr.log"
          lines=p.read_text(errors="replace").splitlines() if p.exists() else []
          matches=[z.strip() for z in lines if re.search(r"(Error|ERR_|invalid|failed|ENOENT|EISDIR|SyntaxError)",z)]
          msg=matches[0] if matches else "NONE"
          msg=re.sub(r"[^A-Za-z0-9_.: -]","_",msg)[:130]
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf8") as f:
            f.write("source_error="+msg+"\n")
          PY
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          node -e 'const r=require(process.argv[1]).total_source_supergraph;for(const [k,v] of Object.entries({files:r.files,relations:r.relation_count,cold_docs:r.cold_documentary_count,cold_bytes:r.cold_documentary_bytes,product:r.product_first_solution.product_observed_closure.files,union:r.product_first_solution.combined_observed_closure.files}))console.log(k+"="+v)' "$RUNNER_TEMP/pr251-source-hypergraph.json" >> "$GITHUB_OUTPUT"
          node -e "const r=require(process.argv[1]);if(r.global_dod!=='HOLD'||r.product_go!==false||!r.head||!r.tree)process.exit(1)" "$RUNNER_TEMP/pr251-source-hypergraph.json"
      - name: "PR251 source error [${{ steps.sg.outputs.source_error }}]"
        if: ${{ always() && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        run: echo "Diagnostic only; original graph generation exit status retained"
      - name: "PR251 source solve [${{ steps.sg.outputs.files }} total, ${{ steps.sg.outputs.relations }} edges, P=${{ steps.sg.outputs.product }}, P+Q=${{ steps.sg.outputs.union }}, cold=${{ steps.sg.outputs.cold_docs }} docs]"
        if: ${{ !cancelled() && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        run: echo "Source-level candidate budget only, no deletion is authorized"
      - name: "PR251 census exception [${{ steps.sg.outputs.source_error }}]"
        if: ${{ always() && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        run: echo "Source-only failure retained"
      - name: Preserve HEAD-bound PR251 source witness
        if: ${{ always() && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr251-hypergraph-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/pr253-dual-epoch.json
            ${{ runner.temp }}/pr251-source-hypergraph.json
            ${{ runner.temp }}/pr251-graph-stderr.log
          if-no-files-found: error
          retention-days: 14
      - name: Deterministic tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/ikant-ci-tests.log"
      - name: Contract and lifecycle check
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/ikant-ci-check.log"
      - name: Native GitHub failure annotations (source diagnostics only)
        if: ${{ failure() }}
        shell: bash
        run: |
          node scripts/ci-failure-annotations.mjs tap "$RUNNER_TEMP/ikant-ci-tests.log"
          node scripts/ci-failure-annotations.mjs check "$RUNNER_TEMP/ikant-ci-check.log"
      - name: Capture original first TAP and check failures
        if: ${{ failure() }}
        id: ci_edge
        run: |
          node scripts/ci-failure-annotations.mjs first-edge tap "$RUNNER_TEMP/ikant-ci-tests.log" first_tap
          node scripts/ci-failure-annotations.mjs first-edge check "$RUNNER_TEMP/ikant-ci-check.log" first_check
      - name: Capture exact TAP assertion detail
        if: ${{ failure() }}
        id: ci_detail
        run: node scripts/ci-failure-annotations.mjs first-detail tap "$RUNNER_TEMP/ikant-ci-tests.log" first_detail
      - name: "First TAP assertion detail [${{ steps.ci_detail.outputs.first_detail }}]"
        if: ${{ failure() }}
        run: echo "Diagnostic only; original test remains failed"
      - name: "First TAP failure [${{ steps.ci_edge.outputs.first_tap }}]"
        if: ${{ failure() }}
        run: echo "First TAP failure is source-only diagnostic, no owner receipt"
      - name: "First contract failure [${{ steps.ci_edge.outputs.first_check }}]"
        if: ${{ failure() }}
        run: echo "First contract failure is source-only diagnostic, no owner receipt"
      - name: Preserve full CI diagnostic logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ikant-ci-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ikant-ci-tests.log
            ${{ runner.temp }}/ikant-ci-check.log
          if-no-files-found: warn
          retention-days: 14
      - name: C5 one-million recurrent self-world semantic falsification
        run: npm run falsify:c5
      - name: Verify C5 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('tests/artifacts/qualification/c5-runtime.json','utf8'));
          if(r.status!=='PASS') throw new Error('C5 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('1M mismatch');
          if(r.categories.ordinary!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('strata mismatch');
          if(r.family_count!==40 || r.family_violations.length!==0) throw new Error('family mismatch');
          if(r.claim_boundary.consciousness_proof!==false || r.claim_boundary.biological_equivalence_proof!==false || r.claim_boundary.iit_phi_proof!==false) throw new Error('claim boundary missing');
          console.log(`IKANT_LE_C5_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C5_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C6 one-million end-user first-contact qualification
        run: npm run falsify:c6
      - name: Verify C6 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('tests/artifacts/qualification/c6-enduser.json','utf8'));
          if(r.status!=='PASS') throw new Error('C6 qualification not PASS');
          if(r.cases!==1_000_000) throw new Error('C6 case count mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C6 strata mismatch');
          if(r.families_exercised!==288 || r.violations.length!==0) throw new Error('C6 family/violation mismatch');
          if(r.claim_boundary.mutation_proves_conforming_host_behavior!==false || r.claim_boundary.mutation_proves_universal_agent_compliance!==false) throw new Error('C6 claim boundary missing');
          console.log(`IKANT_LE_C6_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C6_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C7 one-million documentation and API-transport qualification
        run: npm run falsify:c7
      - name: Verify C7 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('tests/artifacts/qualification/c7-doc-api.json','utf8'));
          if(r.status!=='PASS') throw new Error('C7 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('C7 1M mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C7 strata mismatch');
          if(r.family_count!==41 || r.unexercised_families.length!==0 || r.violations.length!==0) throw new Error('C7 family/violation mismatch');
          if(r.documentation.as_is_bytes!==61013 ||
             r.documentation.readme_bytes<16000 || r.documentation.readme_bytes>48000 ||
             r.documentation.support_bytes>25000 || r.documentation.to_be_bytes>73000 ||
             r.documentation.limits?.readme_max!==48000)
              throw new Error('C7 scoped completeness and authority budget');
          if(r.claim_boundary.mutation_proves_document_semantic_perfection!==false || r.claim_boundary.mutation_proves_universal_host_compliance!==false || r.claim_boundary.mutation_proves_api_availability!==false) throw new Error('C7 claim boundary missing');
          console.log(`IKANT_LE_C7_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C7_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C8 emergence and subjectivity claim-boundary falsification
        run: npm run falsify:c8
      - name: Verify C8 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('tests/artifacts/qualification/c8-emergence.json','utf8'));
          if(r.status!=='PASS') throw new Error('C8 qualification not PASS');
          if(r.engineering.cases!==100 || r.engineering.draft_killed!==65 || r.engineering.draft_false_green_survivors!==35 || r.engineering.revised_claim_boundary_survivors!==0) throw new Error('C8 engineering mutation mismatch');
          if(r.ontology.cases!==1000 || r.ontology.draft_accepts!==800 || r.ontology.draft_false_green_if_claim_open_emergence!==760 || r.ontology.draft_false_green_if_claim_strong_emergence!==800 || r.ontology.draft_false_green_if_claim_phenomenology!==800 || r.ontology.revised_claim_boundary_survivors!==0) throw new Error('C8 ontology mutation mismatch');
          if(r.claim_boundary.mutation_proves_emergence!==false || r.claim_boundary.mutation_proves_strong_emergence!==false || r.claim_boundary.mutation_proves_phenomenology!==false) throw new Error('C8 claim boundary missing');
          console.log(`IKANT_LE_C8_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C8_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C9 one-million Surface B delivery mutations
        run: npm run falsify:c9
      - name: Verify C9 receipt
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('tests/artifacts/qualification/c9-surface-b.json','utf8'));
          if(r.status!=='PASS') throw new Error('C9 qualification not PASS');
          if(r.cases!==1_000_000 || r.survivors!==0) throw new Error('C9 1M mismatch');
          if(r.categories.typical!==500_000 || r.categories.edge!==300_000 || r.categories.stress!==200_000) throw new Error('C9 strata mismatch');
          if(r.family_count!==35 || r.unexercised_families.length!==0 || r.violations.length!==0) throw new Error('C9 family mismatch');
          if(r.contract.exactly_one_docx!==true || r.contract.structured_handoff!==true || r.contract.same_turn_presentation_required!==true || r.contract.filename_only_is_delivery!==false) throw new Error('C9 delivery contract missing');
          if(r.contract.explicit_unknowns_required!==true || r.contract.descriptor_digest_self_validating!==true || r.contract.release_digest_self_validating!==true) throw new Error('C9 integrity contract missing');
          if(r.claim_boundary.mutation_proves_host_ui_presentation!==false || r.claim_boundary.mutation_proves_exhaustive_machine_telemetry!==false || r.claim_boundary.mutation_proves_external_delivery!==false) throw new Error('C9 claim boundary missing');
          console.log(`IKANT_LE_C9_SOURCE=${r.source_binding.digest}`);
          console.log(`IKANT_LE_C9_RECEIPT=${r.receipt_sha256}`);
          NODE
      - name: C38 one-million semantic-lossless runtime falsification
        run: npm run falsify:c38


  physical_documentary_ddmin:
    name: pr251-physical-documentary-ddmin
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin historical PR251 epoch and qualify current PR253 source (strict AND)
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/governance/changes/edu-onezip-runtime-successor.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pr253-epoch-qualification.mjs '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/pr253-dual-epoch.json"
          git worktree add --detach "$RUNNER_TEMP/pr251-epoch" 888a5878a30864e6db7813b3d8b236cde46cce40
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD)" = "888a5878a30864e6db7813b3d8b236cde46cce40"
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD^{tree})" = "6dab517b2ef0462b9c1222dc9ec2a8c164344977"
          echo 'Current exact-source HEAD gate passed; historical PR251 checks are isolated, not current EDU qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Derive original outside-PQ candidates from exact source HEAD
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          mkdir -p "$RUNNER_TEMP/pr251-physical-results"
          node scripts/pr251-forensic-hypergraph.mjs --deep > "$RUNNER_TEMP/pr251-physical-graph.json"
      - name: Stage and minimize real tracked deletions with original Node20 TAP
        id: physical
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          node scripts/pr251-physical-ddmin.mjs "$RUNNER_TEMP/pr251-physical-graph.json" "$RUNNER_TEMP/pr251-physical-results"
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const r=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'pr251-physical-results','physical-ddmin.json'),'utf8'));
          if(r.status!=='ONE_MINIMAL_NATIVE_DOCUMENTARY_COUNTEREXAMPLE'||
             r.physical_minimization.kernel.length!==1||
             r.global_dod!=='HOLD'||r.product_go!==false)throw Error('NOT_ONE_MINIMAL_OR_UNAUTHORIZED');
          const kernel=r.physical_minimization.kernel[0].replace(/[^A-Za-z0-9_.\/-]/g,'_');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'kernel='+kernel+'\nprobes='+r.physical_minimization.probes+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Original native physical ddmin (bounded source-only)\n\n'+
            '| Evidence | Observed |\n| --- | --- |\n'+
            '| Exact HEAD | `'+r.source.head+'` |\n'+
            '| Exact Git TREE | `'+r.source.tree+'` |\n'+
            '| Original native one-minimal kernel | `'+kernel+'` |\n'+
            '| Original ddmin probes | '+r.physical_minimization.probes+' |\n'+
            '| Product native mutant/control | '+r.product_smoke_mutant.status+' / '+r.product_smoke_control.status+' |\n'+
            '| Global DoD | HOLD |\n| External consumers | UNKNOWN |\n\n');
          NODE
      - name: "Physical original-oracle kernel [${{ steps.physical.outputs.kernel }}]; probes=${{ steps.physical.outputs.probes }}"
        run: echo "Bounded documentary one-minimal counterexample is not proof of global equivalence or a deletion grant."
      - name: Independently readback native logs and exact Git identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          node --input-type=commonjs - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto'),cp=require('node:child_process'),path=require('node:path');
          const dir=path.join(process.env.RUNNER_TEMP,'pr251-physical-results');
          const r=JSON.parse(fs.readFileSync(path.join(dir,'physical-ddmin.json'),'utf8'));
          const src=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const tree=cp.execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();
          if(r.status!=='ONE_MINIMAL_NATIVE_DOCUMENTARY_COUNTEREXAMPLE'||
             r.source.head!==src||r.source.tree!==tree||
             r.physical_minimization.status!=='ONE_MINIMAL_FAILURE_KERNEL'||
             r.physical_minimization.kernel.length!==1||
             r.product_go!==false||r.global_dod!=='HOLD'||
             r.authorized_deletion!==false||
             r.dynamic_and_external_consumers!=='UNKNOWN')
            throw Error('PHYSICAL_DDMIN_SCOPE_OR_CERTIFICATE_INVALID');
          const hash=t=>crypto.createHash('sha256').update(t).digest('hex');
          for(const trial of r.materialized_trials){
            const file=path.join(dir,'trial-'+trial.id+'-original.tap');
            if(!fs.existsSync(file)||hash(fs.readFileSync(file))!==trial.original_native.log_sha256)
              throw Error('PHYSICAL_ORIGINAL_NATIVE_LOG_MISMATCH:'+trial.id);
            if(trial.product_native){
              const p=path.join(dir,'trial-'+trial.id+'-product.tap');
              if(!fs.existsSync(p)||hash(fs.readFileSync(p))!==trial.product_native.log_sha256)
                throw Error('PHYSICAL_PRODUCT_LOG_MISMATCH:'+trial.id);
            }
            if(trial.source_head!==src||trial.source_tree!==tree||
               trial.product_go!==false||trial.authorized_deletion!==false)
              throw Error('PHYSICAL_UNAUTHORIZED_PROMOTION');
          }
          const kernel=r.physical_minimization.kernel[0];
          const pre=cp.execFileSync('git',['rev-parse','HEAD:'+kernel],{encoding:'utf8'}).trim();
          if(!r.candidates.some(c=>c.path===kernel&&c.sha===pre))
            throw Error('MINIMIZED_PREIMAGE_NOT_ORIGINAL_GIT');
          console.log(JSON.stringify({source:src,original_oracle:r.consumer_test,
            semantic_edge:r.consumer_hyperedge,kernel,probes:r.physical_minimization.probes,
            native:'ONE_MINIMAL_ORIGINAL_TAP',product_smoke:r.product_smoke_mutant.status,
            evidence:'ORIGINAL_GIT_AND_BOUNDED_NATIVE_NOT_GLOBAL',global_dod:r.global_dod}));
          NODE
      - name: Preserve actual Git staged-tree and original native traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr251-physical-ddmin-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr253-dual-epoch.json
            ${{ runner.temp }}/pr251-physical-graph.json
            ${{ runner.temp }}/pr251-physical-results/*.tap
            ${{ runner.temp }}/pr251-physical-results/*.json
          if-no-files-found: warn
          retention-days: 14

  radical_counterfactual:
    name: pr251-radical-counterfactual-native
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin historical PR251 epoch and qualify current PR253 source (strict AND)
        if: ${{ github.event_name == 'pull_request' && hashFiles('contracts/governance/changes/edu-onezip-runtime-successor.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pr253-epoch-qualification.mjs '${{ github.event.pull_request.head.sha }}' > "$RUNNER_TEMP/pr253-dual-epoch.json"
          git worktree add --detach "$RUNNER_TEMP/pr251-epoch" 888a5878a30864e6db7813b3d8b236cde46cce40
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD)" = "888a5878a30864e6db7813b3d8b236cde46cce40"
          test "$(git -C "$RUNNER_TEMP/pr251-epoch" rev-parse HEAD^{tree})" = "6dab517b2ef0462b9c1222dc9ec2a8c164344977"
          echo 'Current exact-source HEAD gate passed; historical PR251 checks are isolated, not current EDU qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Materialize 425-file candidate in disposable worktree
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          node scripts/pr251-forensic-hypergraph.mjs --deep > "$RUNNER_TEMP/pr251-graph.json"
          git worktree add --detach "$RUNNER_TEMP/pr251-counterfactual" HEAD > /dev/null
          node - "$RUNNER_TEMP/pr251-graph.json" "$RUNNER_TEMP/pr251-counterfactual" "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const [report,dir,output]=process.argv.slice(2);
          const r=JSON.parse(fs.readFileSync(report,'utf8'));
          const g=r.total_source_supergraph;
          const rows=g.product_first_solution.outside_paths;
          if(rows.length<100||g.files!==g.semantic_inventory.length||
            g.product_go!==false||r.product_go!==false)throw Error('INVALID_COUNTERFACTUAL');
          let removedBytes=0;
          for(const row of rows){
            const target=path.resolve(dir,row.path);
            if(!target.startsWith(path.resolve(dir)+path.sep))throw Error('CUT_ESCAPE');
            fs.rmSync(target,{force:true});
            removedBytes+=row.bytes;
          }
          fs.appendFileSync(output,'cut_count='+rows.length+'\ncut_bytes='+removedBytes+'\n');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'pr251-counterfactual-cut.json'),
            JSON.stringify({head:r.head,tree:r.tree,removed:rows,removed_bytes:removedBytes,
              source_only:true,external_consumers:'UNKNOWN',product_go:false},null,2)+'\n');
          NODE
      - name: Replay original native and contract gates on isolated candidate
        id: native
        shell: bash
        run: |
          set +e
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          cd "$RUNNER_TEMP/pr251-counterfactual"
          npm test > "$RUNNER_TEMP/pr251-cut-native.log" 2>&1
          native=$?
          npm run check > "$RUNNER_TEMP/pr251-cut-contract.log" 2>&1
          contract=$?
          if [ "$native" -eq 0 ] && [ "$contract" -eq 0 ]; then verdict=NATIVE_PASS_EXTERNAL_UNKNOWN; else verdict=REJECTED_BY_NATIVE_OR_CONTRACT; fi
          printf 'native_exit=%s\ncontract_exit=%s\nverdict=%s\n' "$native" "$contract" "$verdict" >> "$GITHUB_OUTPUT"
          echo "$verdict" > "$RUNNER_TEMP/pr251-cut-verdict.txt"
          exit 0
      - name: "Radical candidate ${{ steps.candidate.outputs.cut_count }} files / ${{ steps.candidate.outputs.cut_bytes }} bytes [${{ steps.native.outputs.verdict }}]"
        if: ${{ always() }}
        run: echo "Source graph and isolated native results are NOT product or external equivalence proof."
      - name: Adaptive semantic strata against original native and contract gates
        id: adaptive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          python3 - <<'PY'
          import collections,json,os,pathlib,re,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          source=json.loads((temp/'pr251-graph.json').read_text())
          rows=source['total_source_supergraph']['product_first_solution']['outside_paths']
          groups=collections.defaultdict(list)
          for row in rows:
            p=row['path']
            kind=('docs' if p.startswith('project/docs/') else
                  'project' if p.startswith('project/') else
                  'scripts' if p.startswith('scripts/') else
                  'contracts' if p.startswith('contracts/') else
                  'runtime' if p.startswith(('src/','host/')) else 'other')
            groups[kind].append(row)
          order=['docs','project','other','scripts','contracts','runtime']
          def trial(key,targets):
            wd=temp/('pr251-trial-'+key)
            subprocess.run(['git','worktree','add','--detach',str(wd),'HEAD'],check=True,stdout=subprocess.DEVNULL)
            try:
              for row in targets:
                file=(wd/row['path']).resolve()
                if not file.is_relative_to(wd.resolve()):raise RuntimeError('CUT_PATH_ESCAPE')
                file.unlink(missing_ok=True)
              outputs={}
              for gate,args in [('native',['npm','test']),('contract',['npm','run','check'])]:
                p=temp/('pr251-stratum-'+key+'-'+gate+'.log')
                with p.open('wb') as f:
                  try:r=subprocess.run(args,cwd=wd,stdout=f,stderr=subprocess.STDOUT,timeout=300)
                  except subprocess.TimeoutExpired:r=None
                txt=p.read_text(errors='replace')
                first=next((x.strip() for x in txt.splitlines() if re.match(r'^not ok [0-9]+ - ',x)),'NONE')
                outputs[gate]={'exit_code':r.returncode if r else 'TIMEOUT','first_tap':first[:180]}
              return {'key':key,'removed':len(targets),'bytes':sum(v['bytes'] for v in targets),
                      'gates':outputs,'pass':all(v['exit_code']==0 for v in outputs.values())}
            finally:
              subprocess.run(['git','worktree','remove','--force',str(wd)],check=True,stdout=subprocess.DEVNULL)
          baseline=trial('baseline',[])
          accepted=[];results=[]
          if baseline['pass']:
            for group in order:
              if not groups[group]:continue
              candidate=accepted+groups[group]
              outcome=trial(group,candidate)
              outcome['group_files']=len(groups[group])
              results.append(outcome)
              if outcome['pass']:accepted=candidate
          report={'schema':'ikant-pr251-adaptive-counterfactual/v1',
                  'head':source['head'],'tree':source['tree'],
                  'candidate_total':len(rows),'baseline':baseline,
                  'strata':results,'accepted':accepted,
                  'accepted_files':len(accepted),
                  'accepted_bytes':sum(x['bytes'] for x in accepted),
                  'external_unknown':True,'product_go':False,
                  'global_equivalence':'NOT_ATTESTED'}
          (temp/'pr251-adaptive.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('baseline='+('PASS' if baseline['pass'] else 'FAIL')+'\n')
            f.write('accepted_files='+str(len(accepted))+'\n')
            f.write('accepted_bytes='+str(report['accepted_bytes'])+'\n')
          PY
      - name: "Adaptive solution baseline=${{ steps.adaptive.outputs.baseline }} files=${{ steps.adaptive.outputs.accepted_files }} bytes=${{ steps.adaptive.outputs.accepted_bytes }}"
        if: ${{ always() }}
        run: echo "Passing bounded native regression is necessary but external owner/provider review is still required."
      - name: PR251 exact-HEAD causal counterfactual verdict (reject false green)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f contracts/governance/changes/edu-onezip-runtime-successor.json ]; then cd "$RUNNER_TEMP/pr251-epoch"; fi
          node scripts/pr251-causal-oracle.mjs "$RUNNER_TEMP/pr251-adaptive.json" "$RUNNER_TEMP/pr251-cut-verdict.txt" "$RUNNER_TEMP/pr251-graph.json" "$RUNNER_TEMP/pr251-causal-verdict.json"
      - name: Preserve isolated cut and original native evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pr251-radical-counterfactual-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/pr253-dual-epoch.json
            ${{ runner.temp }}/pr251-graph.json
            ${{ runner.temp }}/pr251-counterfactual-cut.json
            ${{ runner.temp }}/pr251-cut-native.log
            ${{ runner.temp }}/pr251-cut-contract.log
            ${{ runner.temp }}/pr251-cut-verdict.txt
            ${{ runner.temp }}/pr251-adaptive.json
            ${{ runner.temp }}/pr251-causal-verdict.json
            ${{ runner.temp }}/pr251-stratum-*.log
          if-no-files-found: warn
          retention-days: 14

  cora_source_replay:
    name: cora-independent-source
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Check PR251 source epoch scope
        id: pr251_scope
        shell: bash
        run: |
          if [ -f contracts/pr251-forensic-hypergraph-dod.json ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pin CORA engine to reviewed source SHA
        if: ${{ steps.pr251_scope.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # An immutable reviewed SHA must not be confused with moving origin/main.
          git clone --quiet https://github.com/Luke883i/cora.git "$RUNNER_TEMP/cora-engine"
          git -C "$RUNNER_TEMP/cora-engine" cat-file -e "900399b5b5b6e7074e37c206f6c566ddf72b9dc6^{commit}"
          git -C "$RUNNER_TEMP/cora-engine" checkout --quiet --detach 900399b5b5b6e7074e37c206f6c566ddf72b9dc6
          test "$(git -C "$RUNNER_TEMP/cora-engine" rev-parse HEAD)" = "900399b5b5b6e7074e37c206f6c566ddf72b9dc6"
      - name: CORA independent Git source ledger and SHA revalidation
        if: ${{ steps.pr251_scope.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$RUNNER_TEMP/cora-engine/src"
          python3 -m cora.cli snapshot . --revision HEAD --output "$RUNNER_TEMP/cora-source-ledger.json"
          python3 -m cora.cli verify-ledger "$RUNNER_TEMP/cora-source-ledger.json" --repo . > "$RUNNER_TEMP/cora-source-verify.json"
      - name: Derive HEAD-exact portable CORA owner profile (no invented witnesses)
        if: ${{ steps.pr251_scope.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          head = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          owners = [
            {'id':'edu-owner','path':'host/c135-edu-v2-owner.mjs'},
            {'id':'mcp-server','path':'project/plugins/ikant-le-session-chat/server/server.mjs'},
            {'id':'ledger-writer','path':'host/c87-durable-ledger.mjs'}]
          for row in owners:
            subprocess.check_call(['git','cat-file','-e','HEAD:'+row['path']])
          profile = {'schema':'cora-portable-target/3','target_repo':'Luke883i/iKant_EDU',
            'revision':head,'owners':owners,'witnesses':[],'method_links':[],
            'source_manifests':{'artifact_roles':'contracts/cora-source-roles.json',
              'ontology':'contracts/cora-source-ontology.json'}}
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'cora-target-profile.json'
          path.write_text(json.dumps(profile,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY
      - name: CORA independent portable One-Run source scope
        id: cora_portable
        if: ${{ steps.pr251_scope.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set +e
          export PYTHONPATH="$RUNNER_TEMP/cora-engine/src"
          python3 -m cora.cli process-run . --revision HEAD --one-run --portable-profile "$RUNNER_TEMP/cora-target-profile.json" --output "$RUNNER_TEMP/cora-one-run.json" --atlas-html "$RUNNER_TEMP/cora-one-run.html" > "$RUNNER_TEMP/cora-portable-stdout.log" 2>&1
          result=$?
          # Source gate: both original CORA methods must ACTUALLY execute. Missing,
          # unconfigured, replay-only and source-partial methods never count as PASS.
          if [ "$result" -eq 0 ]; then
            python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'cora-one-run.json'
          x=json.loads(p.read_text(encoding='utf8'))
          source=x['source_process']
          assert x['source_status']=='PASS_SCOPED_GIT_SOURCE_ONLY'
          assert source['status']=='PASS_SCOPED_WITH_UNVERIFIED_GAPS'
          methods={row['method']:row for row in source['results']}
          for method in ('artifact_roles','python_candidate_graph'):
              row=methods[method]
              assert row['status']=='REUSED_SCOPED_FROM_HOLISTIC',(method,row)
              assert isinstance(row['source_digest'],str) and row['source_digest'],method
          assert source['manifest_paths']=={
              'artifact_roles':'contracts/cora-source-roles.json',
              'ontology':'contracts/cora-source-ontology.json'}
          assert x['authorization']=='NONE'
          assert x['behavior_status']=='BLOCKED_EXTERNAL'
          PY
          fi
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'cora-one-run.json'
          if p.is_file():
            x=json.loads(p.read_text(encoding='utf8'))
            src=x.get('source_status','UNKNOWN')
            suite=x.get('source_process',{}).get('status','UNKNOWN')
            blocked=[r.get('method','?') for r in x.get('source_process',{}).get('results',[])
                     if r.get('status')=='DEBT_BLOCKED']
          else:
            src,suite,blocked='REPORT_NOT_WRITTEN','UNKNOWN',['REPORT_NOT_WRITTEN']
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as f:
            f.write('source_status='+str(src)+'\n')
            f.write('source_process='+str(suite)+'\n')
            f.write('blocked_methods='+','.join(blocked)[:140]+'\n')
          PY
          exit "$result"
      - name: "CORA blocked methods [${{ steps.cora_portable.outputs.blocked_methods }}]"
        if: ${{ always() && steps.pr251_scope.outputs.enabled == 'true' }}
        run: echo "Source-only debt diagnostic, does not change the failing result"
      - name: "CORA observed status [${{ steps.cora_portable.outputs.source_status }}] process [${{ steps.cora_portable.outputs.source_process }}]"
        if: ${{ always() && steps.pr251_scope.outputs.enabled == 'true' }}
        run: echo "Diagnostic only; original independent source result is unchanged"
      - name: CORA independently verify portable source replay
        if: ${{ always() && steps.pr251_scope.outputs.enabled == 'true' && hashFiles('contracts/pr251-forensic-hypergraph-dod.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$RUNNER_TEMP/cora-one-run.json" ]; then exit 1; fi
          export PYTHONPATH="$RUNNER_TEMP/cora-engine/src"
          python3 -m cora.cli verify-process "$RUNNER_TEMP/cora-one-run.json" --repo . --one-run --portable-profile "$RUNNER_TEMP/cora-target-profile.json" --atlas-html "$RUNNER_TEMP/cora-one-run.html" > "$RUNNER_TEMP/cora-one-run-replay.json"
      - name: Preserve independent CORA source replay and open gates
        if: ${{ always() && steps.pr251_scope.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr251-cora-engine-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/cora-target-profile.json
            ${{ runner.temp }}/cora-source-ledger.json
            ${{ runner.temp }}/cora-source-verify.json
            ${{ runner.temp }}/cora-portable-stdout.log
            ${{ runner.temp }}/cora-one-run.json
            ${{ runner.temp }}/cora-one-run.html
            ${{ runner.temp }}/cora-one-run-replay.json
          if-no-files-found: warn
          retention-days: 14

  differential_edu_mcp:
    name: edu-mcp-same-runner-differential
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Same-host main and candidate native product tests
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=e270c6e2cc772f960126eecea9f50501339e3656
          test "$(git rev-parse "$BASE_SHA^{commit}")" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git worktree add --detach "$RUNNER_TEMP/ikant-main" "$BASE_SHA"
          files=(tests/project-edu-complete-chain.test.mjs tests/mcp-standalone-runtime-assurance.test.mjs tests/project-session-e2e.test.mjs tests/c139-epistemic-edu-v2.test.mjs tests/cp11-guarded-prepr.test.mjs)
          (cd "$RUNNER_TEMP/ikant-main" && CI=true node --test --test-concurrency=1 "${files[@]}" > "$RUNNER_TEMP/ikant-main.tap" 2>&1)
          CI=true node --test --test-concurrency=1 "${files[@]}" > "$RUNNER_TEMP/ikant-head.tap" 2>&1
      - name: Refute lost cases, changed PASS and claimed host release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections,json,os,pathlib,re,subprocess
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          def parse(path):
            text=path.read_text(encoding='utf8')
            lines=re.findall(r'^\s*(ok|not ok)\s+\d+\s+-\s+(.+)$',text,re.M)
            passed=collections.Counter()
            failed=[];skipped=[]
            for state,name in lines:
              name=name.split(' # ',1)[0].strip()
              if '# SKIP' in text: pass
              if state=='not ok':failed.append(name)
