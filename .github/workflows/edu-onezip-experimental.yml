name: EDU OneZIP experimental (source and owner-boundary)
on:
  pull_request:
    paths:
      - 'scripts/project-edu-*.mjs'
      - 'scripts/project-edu-*.py'
      - 'scripts/project-source-manifest.mjs'
      - 'contracts/project-session-source.json'
      - 'contracts/project-edu-onezip-field-route.json'
      - 'project/session-chat/PROMPT.txt'
      - 'BOOTSTRAP.json'
      - 'tests/project-edu-onezip-route.test.mjs'
      - 'tests/project-edu-onezip-session-local.test.mjs'
      - 'contracts/edu-onezip-retirement-review.json'
      - 'tests/test_edu_zip_tree.py'
      - 'tests/project-edu-onezip-full-source.test.mjs'
      - 'tests/project-edu-onezip-full-source-transport.test.mjs'
      - '.github/workflows/edu-onezip-experimental.yml'
  workflow_dispatch:
jobs:
  source-and-protocol:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs are synthetic; qualify the exact proposed source HEAD.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The retirement census also reads the pinned historical main object.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check original source closure
        run: node scripts/project-source-manifest.mjs verify
      - name: Test ZIP TREE-root recomputation
        run: python -m unittest discover -s tests -p test_edu_zip_tree.py -v
      - name: Test Host-language and original-owner fail-closed boundaries
        run: node --test tests/project-edu-onezip-route.test.mjs
      - name: Full source 1 - git archive from exact PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 700 "$TMP"
          HEAD_SHA="$(git rev-parse HEAD)"
          TREE_SHA="$(git rev-parse HEAD^{tree})"
          echo "EDU_TMP=$TMP" >> "$GITHUB_ENV"
          echo "EDU_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "EDU_TREE=$TREE_SHA" >> "$GITHUB_ENV"
          git archive --format=zip --prefix="iKant_EDU-${HEAD_SHA}/" HEAD > "$TMP/source.zip"
      - name: Full source 2 - recompute ZIP Git tree root
        run: python scripts/project-edu-zip-tree.py --archive "$EDU_TMP/source.zip" --head "$EDU_HEAD" --tree "$EDU_TREE" --output "$EDU_TMP/derived-tree.json"
      - name: Full source 3 - original Python archive converter
        run: python scripts/project-manual-source.py --source-zip "$EDU_TMP/source.zip" --api-tree "$EDU_TMP/derived-tree.json" --head "$EDU_HEAD" --tree "$EDU_TREE" --output-plan "$EDU_TMP/plan.json"
      - name: Full source 4 - original Node TREE and blob readback
        run: node scripts/project-repo-loader.mjs "$EDU_TMP/plan.json" "$EDU_TMP/materialized" "$EDU_HEAD" "$EDU_TREE"
      - name: Full source 5a - original C72 accepted intro and EDU selection
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" EDU_TEST_PHASE=C72_ONLY node --test tests/project-edu-onezip-full-source.test.mjs
      - name: Full source 5b0 - original C135 boot
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" EDU_TEST_PHASE=C135_BOOT node --test tests/project-edu-onezip-full-source.test.mjs
      - name: Full source 5b1 - original C135 first voice
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" EDU_TEST_PHASE=C135_VOICE node --test tests/project-edu-onezip-full-source.test.mjs
      - name: Full source 5b2 - original C87 checkpoint
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" EDU_TEST_PHASE=C135_FIRST node --test tests/project-edu-onezip-full-source.test.mjs
      - name: Full source 5c - original C135 second restored turn
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" EDU_TEST_PHASE=C135_SECOND node --test tests/project-edu-onezip-full-source.test.mjs
      - name: Full source 6 - physically mediated OneZIP admission and two original C135 worker turns
        run: EDU_TEST_SOURCE_ROOT="$EDU_TMP/materialized" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" node --test tests/project-edu-onezip-full-source-transport.test.mjs
      - name: One handoff then local session continuity and read-only reopen
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE="$(mktemp -d)"
          chmod 700 "$PRIVATE"
          python scripts/project-edu-onezip-ingress.py --archive "$EDU_TMP/source.zip" --head "$EDU_HEAD" --tree "$EDU_TREE" --private-root "$PRIVATE" --helper-pins \
            "$(git rev-parse "$EDU_HEAD:scripts/project-edu-zip-tree.py")" \
            "$(git rev-parse "$EDU_HEAD:scripts/project-manual-source.py")" \
            "$(git rev-parse "$EDU_HEAD:scripts/project-repo-loader.mjs")" 2>&1 | tee "$RUNNER_TEMP/edu-onezip-step.log"
          EDU_TEST_SOURCE_ROOT="$PRIVATE/source" EDU_TEST_HEAD="$EDU_HEAD" EDU_TEST_TREE="$EDU_TREE" node --test tests/project-edu-onezip-session-local.test.mjs 2>&1 | tee -a "$RUNNER_TEMP/edu-onezip-step.log"
      - name: Capture exact local OneZIP failure (diagnostic only)
        if: ${{ failure() }}
        id: local_failure
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'edu-onezip-step.log'
          rows=p.read_text(errors='replace').splitlines() if p.exists() else []
          tests=[line.strip() for line in rows if re.match(r'^\\s*not ok\\s+\\d+',line)]
          errors=[line.strip() for line in rows if re.match(r'^\\s*(?:error:|code:|failureType:)',line)]
          line=((tests[0] if tests else 'ONEZIP_STEP_FAILURE')+' '+(errors[0] if errors else ''))[:110]
          line=re.sub(r'[^A-Za-z0-9_.: -]','_',line)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('detail='+line+'\n')
          PY
      - name: "Local OneZIP first failure [${{ steps.local_failure.outputs.detail }}]"
        if: ${{ failure() }}
        run: echo "Diagnostic only; original test exit status retained"
      - name: Seeded defensive model and conservative retirement census
        run: |
          node scripts/project-edu-onezip-falsify-10m.mjs > "$RUNNER_TEMP/edu-onezip-model.json"
          cmp "$RUNNER_TEMP/edu-onezip-model.json" tests/artifacts/qualification/edu-onezip-model-10m.json
          node scripts/project-edu-retirement-census.mjs > "$RUNNER_TEMP/edu-objects.json"
      - uses: actions/upload-artifact@v4
        with:
          name: edu-onezip-assurance-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/edu-onezip-model.json
            ${{ runner.temp }}/edu-objects.json
      - name: Regression original C135 portable C87 and Project prompt
        run: node --test tests/project-session-e2e.test.mjs tests/project-oneshell-prompt.test.mjs
