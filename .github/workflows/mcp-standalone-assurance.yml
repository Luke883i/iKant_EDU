name: MCP standalone candidate — source and SDK qualification
on:
  pull_request:
    paths:
      - 'project/plugins/ikant-le-session-chat/server/**'
      - 'project/plugins/ikant-le-session-chat/mcp.standalone.template.json'
      - 'tests/mcp-standalone-*.test.mjs'
      - 'scripts/mcp-standalone-semantic-10k.mjs'
      - 'project/release/render.mcp-standalone.candidate.yaml'
      - 'project/docs/MCP_STANDALONE_RENDER_RUNBOOK.txt'
      - '.github/workflows/mcp-standalone-assurance.yml'
  workflow_dispatch:
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and Node scripts
        run: |
          node --check project/plugins/ikant-le-session-chat/server/server.mjs
          node --check project/plugins/ikant-le-session-chat/server/mcp-standalone-policy.mjs
          node --check project/plugins/ikant-le-session-chat/server/runtime-limits.mjs
          node --check scripts/mcp-standalone-semantic-10k.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('project/plugins/ikant-le-session-chat/mcp.standalone.template.json'))"
      - name: Standalone and original OAuth negative regressions
        run: |
          node --test tests/mcp-standalone-runtime-assurance.test.mjs tests/mcp-external-oauth-prepr.test.mjs tests/mcp-external-v2-refinement.test.mjs
      - name: Install exact declared direct MCP SDK dependencies (not a lockfile claim)
        run: npm install --ignore-scripts --no-audit --no-fund --prefix project/plugins/ikant-le-session-chat/server
      - name: Real SDK HTTP transport with SYNTHETIC local OAuth server
        id: http_diag
        shell: bash
        run: |
          set +e
          node --test tests/mcp-standalone-http-qualification.probe.mjs > "$RUNNER_TEMP/mcp-http.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/mcp-http.log"
          edge=$(grep -E '^[[:space:]]*(error|code|expected|actual|operator):' "$RUNNER_TEMP/mcp-http.log" | head -n 4 | tr '\n' ' ' | tr -cd 'A-Za-z0-9_ .:/,=-' | cut -c 1-170)
          if [ -z "$edge" ]; then edge="NO_STRUCTURED_ERROR"; fi
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: "MCP HTTP failure witness: ${{ steps.http_diag.outputs.edge }}"
        if: ${{ failure() }}
        run: exit 1
      - name: Materialize ten thousand scenario questions
        run: node scripts/mcp-standalone-semantic-10k.mjs mcp-standalone-10k.jsonl > mcp-standalone-10k-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-standalone-10k-model-only-not-provider-proof
          path: |
            mcp-standalone-10k-evidence.json
            mcp-standalone-10k.jsonl
