name: R3 Host negative semantic admission and full repository
on:
  pull_request:
    paths:
      - 'host/project-host-negative-rail.mjs'
      - 'host/project-c72-negative-entry.mjs'
      - 'host/project-c72-physical-ingress.mjs'
      - 'contracts/project-host-negative-rail.json'
      - 'contracts/project-c72-negative-entry.json'
      - 'tests/project-host-negative-rail.test.mjs'
      - 'tests/project-c72-physical-ingress.test.mjs'
      - 'scripts/project-host-negative-falsify.mjs'
      - 'tests/artifacts/qualification/negative-semantic-1m.json'
      - 'contracts/project-session-source.json'
      - 'scripts/project-source-manifest.mjs'
      - '.github/workflows/host-negative-semantic-r3.yml'
  workflow_dispatch:
jobs:
  diagnostic-physical-c72:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - 'three carrier paths'
          - 'Host cannot infer'
          - 'REST response path'
          - 'Node request rejection'
          - '10k preaccept'
          - 'AUTO binds'
          - '20k deterministic'
          - 'R3 same-epoch'
          - 'R3 rejects'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One physical test in isolation
        run: node --test --test-name-pattern="${{ matrix.pattern }}" tests/project-c72-physical-ingress.test.mjs
  original-owners-and-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Parse actual integrated Host and negative rail
        run: |
          node --check host/project-host-negative-rail.mjs
          node --check host/project-c72-negative-entry.mjs
          node --check host/project-c72-physical-ingress.mjs
          node --check scripts/project-host-negative-falsify.mjs
      - name: Original source closure verification
        run: node scripts/project-source-manifest.mjs verify
      - name: R3 negative unit
        run: node --test tests/project-host-negative-rail.test.mjs
      - name: Original physical C72
        run: node --test tests/project-c72-physical-ingress.test.mjs
      - name: Original portable C72
        run: node --test tests/project-c72-portable-bridge.test.mjs
      - name: Original onezip
        run: node --test tests/project-edu-onezip-route.test.mjs
      - name: Original E15/E16 receipt and later EDU preservation
        run: node --test tests/project-oneshell-e15-sterile.test.mjs tests/project-oneshell-e16-hardening.test.mjs tests/project-c72-receipt-transit.test.mjs
      - name: 1 million seeded negative semantic cases against independent oracle
        run: |
          node scripts/project-host-negative-falsify.mjs /tmp/r3-negative-1m.json
          cmp /tmp/r3-negative-1m.json tests/artifacts/qualification/negative-semantic-1m.json
  full-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full existing test suite (owner and history regression)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/r3-full-repository-tap.log"
      - name: Capture first failing full-repository TAP (diagnostic only)
        if: ${{ failure() }}
        id: r3_edge
        run: node scripts/ci-failure-annotations.mjs first-edge tap "$RUNNER_TEMP/r3-full-repository-tap.log" first_edge
      - name: "R3 first TAP failure [${{ steps.r3_edge.outputs.first_edge }}]"
        if: ${{ failure() }}
        run: echo "Original full-repository test remains blocking"
      - name: Capture first failing full-repository assertion detail
        if: ${{ failure() }}
        id: r3_detail
        run: node scripts/ci-failure-annotations.mjs first-detail tap "$RUNNER_TEMP/r3-full-repository-tap.log" first_detail
      - name: "R3 first TAP detail [${{ steps.r3_detail.outputs.first_detail }}]"
        if: ${{ failure() }}
        run: echo "Diagnostic only; full-repository test remains blocking"
      - name: Repository checks
        run: npm run check
      - name: Runtime-root verify
        run: npm run runtime-root:verify
