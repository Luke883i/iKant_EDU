name: Project repository review-readiness and H1 path proof
on:
  pull_request:
    paths:
      - 'README.md'
      - 'host/project-edu-h1-bound-port.mjs'
      - 'contracts/project-review-readiness-v1.json'
      - 'scripts/project-review-callsites.mjs'
      - 'tests/project-review-readiness.test.mjs'
      - 'tests/project-review-physical.test.mjs'
      - 'tests/project-edu-h1-*.test.mjs'
      - '.github/workflows/project-review-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'host/project-edu-h1-bound-port.mjs'
      - 'contracts/project-review-readiness-v1.json'
      - 'scripts/project-review-callsites.mjs'
      - 'tests/project-review-readiness.test.mjs'
      - 'tests/project-review-physical.test.mjs'
      - 'tests/project-edu-h1-*.test.mjs'
      - '.github/workflows/project-review-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-source-software-10x:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['20','22']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: M3 full Git checkout source closure and source mirror (HOST read-only)
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/ikant-m3"
          mkdir -p "$root"
          base=b29e52b8bc1c8d4a9acdfdf9438632842504c8ac
          test "$(git rev-parse "${base}^{tree}")" = "6234ec6d3a02b28d5f95e9ddcfac4a2eb4f5556f"
          git merge-base --is-ancestor "$base" HEAD
          git rev-parse HEAD > "$root/candidate-head.txt"
          git rev-parse 'HEAD^{tree}' > "$root/candidate-tree.txt"
          git status --porcelain --untracked-files=no > "$root/tracked-worktree-status.txt"
          test ! -s "$root/tracked-worktree-status.txt"
          git ls-tree -r -z HEAD > "$root/candidate-ls-tree.z"
          git archive --format=tar "$base" > "$root/original-main-source.tar"
          git archive --format=tar HEAD > "$root/candidate-source.tar"
          sha256sum "$root/original-main-source.tar" "$root/candidate-source.tar" > "$root/archive-sha256.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const dest=process.env.RUNNER_TEMP+'/ikant-m3';
          const raw=fs.readFileSync(dest+'/candidate-ls-tree.z').toString('utf8');
          const rows=raw.split('\0').filter(Boolean);
          let seen=0,bytes=0,workflows=0;
          for(const r of rows){
           const m=/^(100644|100755) blob ([0-9a-f]{40})\t(.+)$/u.exec(r);
           if(!m)throw Error('M3_UNSUPPORTED_GIT_MODE');
           const data=fs.readFileSync(m[3]);
           const actual=crypto.createHash('sha1').update('blob '+data.length+'\0').update(data).digest('hex');
           if(actual!==m[2])throw Error('M3_BLOB_MISMATCH:'+m[3]);
           seen++;bytes+=data.length;if(m[3].startsWith('.github/workflows/'))workflows++;
          }
          if(seen!==1600||workflows!==116)throw Error('M3_COVERAGE_FAIL');
          fs.writeFileSync(dest+'/native-source-readback.json',JSON.stringify({
           schema:'ikant-m3-original-checkout-readback/v1',authority:0,
           head:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),
           tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),
           verified_blobs:seen,verified_workflows:workflows,verified_bytes:bytes,
           source_level:'GIT_BLOB_AND_WORKTREE',consumer_closure:'UNKNOWN',
           owner_outcome:'NOT_INVOKED',permission_to_archive:false
          },null,2)+'\n');
          NODE
          node scripts/project-review-callsites.mjs > "$root/native-callsites.json"
          set +e
          node scripts/v5b-repository-governance-audit.mjs > "$root/native-v5b.log" 2>&1; v5b_rc=$?
          node scripts/cora-minimal-absorption.mjs --reticulum --full > "$root/native-cora.json" 2>&1; cora_rc=$?
          node scripts/cora-pr-g-evidence-readback.mjs > "$root/native-prg.json" 2>&1; prg_rc=$?
          set -e
          printf '{"v5b_exit":%s,"cora_exit":%s,"prg_exit":%s,"approval":"NOT_ATTESTED","provider":"UNKNOWN"}\n' "$v5b_rc" "$cora_rc" "$prg_rc" > "$root/native-audit-exits.json"
      - name: Preserve M3 source evidence before existing qualification cycles
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ikant-m3-original-checkout-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/ikant-m3/
          if-no-files-found: warn
          retention-days: 30
      - name: Exact source, code and governance syntax
        run: |
          node --check host/project-edu-h1-bound-port.mjs
          node --check scripts/project-review-callsites.mjs
          node -e "const x=require('./contracts/project-review-readiness-v1.json');if(x.release_domains.length!==6||x.authority!==0||x.no_new_authorities!==true||x.no_auto_promotion_between_domains!==true)process.exit(1)"
      - name: Ten independent full-checkout software CI cycles
        shell: bash
        run: |
          set -euo pipefail
          for round in $(seq 1 10); do
            echo "=== R6 cycle ${round} of 10 ==="
            npm run check
            node --test tests/project-review-readiness.test.mjs tests/project-review-physical.test.mjs tests/project-edu-h1-bound-port.test.mjs tests/project-edu-h1-original.test.mjs tests/project-edu-h1-dod-trace.test.mjs
            node scripts/project-review-callsites.mjs > "${RUNNER_TEMP}/r6-callsite-${round}.json"
            node --input-type=module -e "import fs from 'node:fs';let x=JSON.parse(fs.readFileSync(process.argv[1]));if(x.schema!=='ikant-host-callsite-census/v1'||x.tracked_file_count<1300||x.js_files_parsed<700||x.authority!==0)process.exit(1)" "${RUNNER_TEMP}/r6-callsite-${round}.json"
            if [ "$round" -gt 1 ]; then
              cmp "${RUNNER_TEMP}/r6-callsite-1.json" "${RUNNER_TEMP}/r6-callsite-${round}.json"
            fi
          done
      - name: Machine-readable call-site census as review artifact
        uses: actions/upload-artifact@v4
        with:
          name: r6-callsite-${{ matrix.node }}-${{ github.sha }}
          path: ${{ runner.temp }}/r6-callsite-1.json
          retention-days: 30
